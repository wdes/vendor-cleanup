name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    outputs:
      deb-artifact-id: ${{ steps.upload-deb.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build .deb package
        run: cargo install cargo-deb && cargo deb --locked
      - name: Attest .deb
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/debian/*.deb
      - name: Upload .deb artifact
        id: upload-deb
        uses: actions/upload-artifact@v7
        with:
          name: vendor-cleanup-deb
          path: target/debian/*.deb
          archive: false

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build
    steps:
      # `archive: false` above uploads the .deb unzipped, so the artifact is
      # named after the file rather than `vendor-cleanup-deb`. Fetch it by id.
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.deb-artifact-id }}
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.deb
